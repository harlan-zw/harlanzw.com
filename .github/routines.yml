# Scheduled agent work for this repository.
#
# harlan-github-agent reads this file from the default branch only, and never
# from a pull request head. It may set the schedule, the mode, and enabled. It
# cannot name a command, a model, or any new authority.
#
# mode: propose opens one issue and pull request per finding. mode: report
# writes the run log and opens nothing.
version: 1
routines:
  - name: daily-checkin
    on:
      schedule:
        - cron: '20 5 * * *'
    timezone: Australia/Sydney
    mode: propose
    enabled: true
  - name: dependency-updates
    on:
      schedule:
        - cron: '20 5 * * 3'
    timezone: Australia/Melbourne
    mode: propose
    enabled: true
  - name: ci-review
    on:
      schedule:
        - cron: '20 5 * * 5'
    timezone: Australia/Melbourne
    mode: propose
    enabled: true
  - name: d1-query-review
    on:
      schedule:
        - cron: '0 10 * * 1'
    timezone: Australia/Melbourne
    mode: propose
    enabled: true
