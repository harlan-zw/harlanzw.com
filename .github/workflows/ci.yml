name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
      actions: read
      # the budget action comments the diff on the pull request
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test:run
      - run: pnpm build
      - uses: harlan-zw/harlan-nuxt/.github/actions/nuxt-dx-budget@main
        with:
          report-path: .nuxt/dx/size-budget.json
          threshold-kb: 10
      - run: pnpm cf:types:check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: Production
      url: https://harlanzw.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache skew protection assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-skew-production-${{ github.sha }}
          restore-keys: |
            nuxt-skew-production-
      - run: pnpm build
        timeout-minutes: 10
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Prepare Worker secrets
        run: |
          test -n "$NUXT_GITHUB_SPONSORS_TOKEN"
          umask 077
          printf '%s' "$NUXT_GITHUB_SPONSORS_TOKEN" | jq -Rs '{NUXT_GITHUB_SPONSORS_TOKEN: .}' > "$RUNNER_TEMP/worker-secrets.json"
        env:
          NUXT_GITHUB_SPONSORS_TOKEN: ${{ secrets.NUXT_GITHUB_SPONSORS_TOKEN }}
      - name: Deploy application Worker
        run: pnpm exec wrangler deploy --message "$GITHUB_SHA" --secrets-file "$RUNNER_TEMP/worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remove Worker secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
      - name: Deploy www redirect Worker
        run: pnpm exec wrangler deploy --config wrangler.www.jsonc --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed versions
        run: |
          for worker in harlanzw-com harlanzw-com-www; do
            for attempt in {1..12}; do
              deployed_sha=$(pnpm exec wrangler deployments list --name "$worker" --json | jq -r 'sort_by(.created_on) | last | .annotations["workers/message"]')
              if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
                break
              fi
              if [ "$attempt" = 12 ]; then
                echo "$worker deployed $deployed_sha, expected $GITHUB_SHA" >&2
                exit 1
              fi
              sleep 5
            done
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke production
        run: |
          test "$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 --output /dev/null --write-out '%{http_code}' https://harlanzw.com/)" = 200
          test "$(curl --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 --output /dev/null --write-out '%{http_code} %{redirect_url}' https://www.harlanzw.com/)" = "308 https://harlanzw.com/"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 "https://harlanzw.com/api/sponsors?deployment=$GITHUB_SHA" | jq -e '._tag == "available" and (.sponsors | length > 0)'
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 --output "$RUNNER_TEMP/sponsors.html" "https://harlanzw.com/sponsors?deployment=$GITHUB_SHA&attempt=$attempt" \
              && grep -q 'Top sponsors' "$RUNNER_TEMP/sponsors.html"; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "Sponsors page did not reach the deployed version" >&2
              exit 1
            fi
            sleep 5
          done
